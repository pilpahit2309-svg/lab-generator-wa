<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LAPORAN HASIL ANALISA LOSSIS PER 2 JAM</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f5f5;
      }

      .card {
        margin-top: 20px;
      }

      textarea {
        height: 650px;
        font-family: monospace;
      }

      h4 {
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card shadow">
        <div class="card-body">
          <h4>Generator Pesan WhatsApp Laboratorium PKS</h4>
          <h5>MUTU & LOSSES PKS</h5>
          <br />
          <div class="row">
            <!-- FORM -->
            <div class="col-md-6">
              <div class="mb-3">
                <label>Tanggal</label>
                <input
                  type="date"
                  id="tanggal"
                  class="form-control"
                  placeholder="13 Juli 2026"
                />
              </div>

              <div class="mb-3">
                <label>Jam</label>
                <input
                  type="text"
                  id="jam"
                  class="form-control"
                  placeholder="19.00"
                />
              </div>

              <hr />

              <h5>Fibre Press</h5>

              <div class="row">
                <div class="col-6">
                  <input
                    id="fp1"
                    class="form-control mb-2"
                    placeholder="No.1"
                    type="number"
                  />
                </div>
                <div class="col-6">
                  <input
                    id="fp2"
                    class="form-control mb-2"
                    placeholder="No.2"
                    type="number"
                  />
                </div>

                <div class="col-6">
                  <input
                    id="fp3"
                    class="form-control mb-2"
                    placeholder="No.3"
                    type="number"
                  />
                </div>
                <div class="col-6">
                  <input
                    id="fp4"
                    class="form-control mb-2"
                    placeholder="No.4"
                    type="number"
                  />
                </div>

                <div class="col-6">
                  <input
                    id="fp5"
                    class="form-control mb-2"
                    placeholder="No.5"
                    type="number"
                  />
                </div>
                <div class="col-6">
                  <input
                    id="fp6"
                    class="form-control mb-2"
                    placeholder="No.6"
                    type="number"
                  />
                </div>
              </div>

              <hr />

              <h5>Bunch Press</h5>

              <input
                id="bp1"
                class="form-control mb-2"
                placeholder="No.1"
                type="number"
              />
              <input
                id="bp2"
                class="form-control mb-2"
                placeholder="No.2"
                type="number"
              />
              <input
                id="bp3"
                class="form-control mb-2"
                placeholder="No.3"
                type="number"
              />
              <input
                id="bp4"
                class="form-control mb-2"
                placeholder="No.4"
                type="number"
              />

              <hr />

              <input
                id="allhp"
                class="form-control mb-2"
                placeholder="All HP"
                type="number"
              />

              <input
                id="finalfe"
                class="form-control mb-2"
                placeholder="Final FE"
                type="number"
              />

              <hr />

              <h5>SOLID DECANTER</h5>

              <input
                id="solid1"
                class="form-control mb-2"
                placeholder="Solid 1"
                type="number"
              />
              <input
                id="solid2"
                class="form-control mb-2"
                placeholder="Solid 2"
                type="number"
              />
              <input
                id="solid3"
                class="form-control mb-2"
                placeholder="Solid 3"
                type="number"
              />

              <hr />
              <h5>FFA COT</h5>

              <input
                id="cot"
                class="form-control mb-2"
                placeholder="FFA cot"
                type="number"
              />
              <hr />
              <h5>CPO Produksi V1</h5>

              <input id="v1ffa" class="form-control mb-2" placeholder="FFA" type="number"/>
              <input
                id="v1moist"
                class="form-control mb-2"
                placeholder="Moist"
                type="number"
              />
              <input
                id="v1dobi"
                class="form-control mb-2"
                placeholder="DOBI"
                type="number"
              />

              <hr />

              <h5>CPO Produksi V2</h5>

              <input
                id="v2ffa"
                class="form-control mb-2"
                placeholder="FFA"
                type="number"
              />
              <input
                id="v2moist"
                class="form-control mb-2"
                placeholder="Moist"
                type="number"
              />
              <input
                id="v2dobi"
                class="form-control mb-2"
                placeholder="DOBI"
                type="number"
              />

              <br />

              <button class="btn btn-success" onclick="buatPesan()">
                Generate
              </button>

              <button class="btn btn-primary" onclick="salin()">Salin</button>

              <button class="btn btn-success" onclick="wa()">WhatsApp</button>
            </div>

            <!-- HASIL -->
            <div class="col-md-6">
              <textarea id="hasil" class="form-control"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function v(id) {
        return document.getElementById(id).value;
      }

      function buatPesan() {
        let pesan = `*MONITORING MUTU & LOSSES PKS SATUI*
*Tanggal:* ${v("tanggal")}
*Pukul:* ${v("jam")} WITA

==================
*I. LOSSES (KEHILANGAN MINYAK)*
==================

*1. Fibre Press (Std < 4.00%)*
• No. 1 : *${v("fp1")} %*
• No. 2 : *${v("fp2")} %*
• No. 3 : *${v("fp3")} %*
• No. 4 : *${v("fp4")} %*
• No. 5 : *${v("fp5")} %*
• No. 6 : *${v("fp6")} %*
_Note:_ [ ... ]

*2. Bunch Press (Std < 1.50%)*
• No. 1 : *${v("bp1")} %*
• No. 2 : *${v("bp2")} %*
• No. 3 : *${v("bp3")} %*
• No. 4 : *${v("bp4")} %*
_Note:_ 

*3. All Heavy Phase / HP Tank*
• Losses : *${v("allhp")} %*
_Note:_ [ ... ]

*4. Final Effluent / FE (Std < 0.80%)*
• Losses : *${v("finalfe")} %*
_Note:_ [ ... ]

*5. Solid Decanter (Std < 4.00%)*
• Solid 1 : *${v("solid1")} %*
• Solid 2 : *${v("solid2")} %*
• Solid 3 : *${v("solid3")} %*
_Note:_ [ ... ]

==================
*II. MUTU & MUTU FFA*
==================

*6. COT (Crude Oil Tank) / Oil Press*
• FFA : *${v("cot")} %* (Std < 4.00%)
_Note:_ 

*7. CPO Produksi Vacuum Dryer 1 (V1)*
• FFA : *${v("v1ffa")} %* (Std <5.00%)
• Moist : *${v("v1moist")} %* (Std < 0.150%)
• DOBI : *${v("v1dobi")}* (Std > 2.00)
_Note:_ 

*8. CPO Produksi Vacuum Dryer 2 (V2)*
• FFA :  *${v("v2ffa")} %*(Std < 5.00%)
• Moist : *${v("v2moist")} %* (Std < 0.150%)
• DOBI : *${v("v2dobi")}* (Std > 2.00)
_Note:_ 

==================
Demikian disampaikan, terima kasih.



`;

        document.getElementById("hasil").value = pesan;
      }

      function salin() {
        navigator.clipboard.writeText(document.getElementById("hasil").value);

        alert("Pesan berhasil disalin");
      }

      function wa() {
        let text = encodeURIComponent(document.getElementById("hasil").value);

        window.open("https://wa.me/?text=" + text);
      }
    </script>
  </body>
</html>

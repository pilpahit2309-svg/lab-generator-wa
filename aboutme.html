<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tentang Saya</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      :root {
        --green-900: #0b4d2c;
        --green-700: #137a43;
        --green-500: #1fa35c;
        --green-100: #e6f6ed;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, #d9f2e3 0, transparent 45%),
          radial-gradient(circle at bottom right, #cfeedd 0, transparent 40%),
          #f4f8f5;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          Roboto,
          sans-serif;
        color: #1f2d26;
      }

      .profile-card {
        max-width: 560px;
        margin: 40px auto;
        border: 0;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(11, 77, 44, 0.15);
      }

      /* Header + foto */
      .profile-hero {
        height: 130px;
        background: linear-gradient(135deg, var(--green-900), var(--green-500));
      }

      .profile-img {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 50%;
        border: 5px solid #fff;
        background: #fff;
        margin-top: -75px;
        box-shadow: 0 8px 20px rgba(11, 77, 44, 0.25);
      }

      .profile-body {
        padding: 16px 28px 28px;
        text-align: center;
      }

      .profile-name {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 14px 0 8px;
      }

      .profile-role {
        display: inline-block;
        padding: 4px 14px;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--green-700);
        background: var(--green-100);
        border-radius: 999px;
      }

      .divider {
        height: 1px;
        margin: 22px 0;
        background: linear-gradient(90deg, transparent, #cfe3d6, transparent);
        border: 0;
      }

      .about-text {
        font-size: 0.92rem;
        line-height: 1.7;
        color: #4a5a51;
        text-align: left;
      }

      .section-title {
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 600;
        color: #7a8a81;
        text-align: left;
        margin: 22px 0 10px;
      }

      /* 4 tombol link ke bawah */
      .link-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .link-btn {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        text-decoration: none;
        color: var(--green-900);
        font-weight: 600;
        background: #fff;
        border: 1px solid #cfe3d6;
        border-radius: 14px;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          background 0.18s ease,
          border-color 0.18s ease;
      }

      .link-btn:hover {
        color: var(--green-900);
        background: var(--green-100);
        border-color: var(--green-500);
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(31, 163, 92, 0.18);
      }

      .link-icon {
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        background: var(--green-100);
        border-radius: 12px;
      }

      .link-btn:hover .link-icon {
        background: #fff;
      }

      .link-text {
        flex: 1;
        text-align: left;
      }

      .link-arrow {
        color: var(--green-500);
        opacity: 0;
        transform: translateX(-6px);
        transition: all 0.18s ease;
      }

      .link-btn:hover .link-arrow {
        opacity: 1;
        transform: translateX(0);
      }

      /* Tombol */
      .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 26px;
      }

      .btn-row .btn {
        flex: 1 1 130px;
        padding: 10px 14px;
        font-weight: 600;
        border-radius: 12px;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          background 0.18s ease;
      }

      .btn-row .btn:hover {
        transform: translateY(-2px);
      }

      .btn-main {
        color: #fff;
        background: var(--green-700);
        border: 1px solid var(--green-700);
      }

      .btn-main:hover {
        color: #fff;
        background: var(--green-900);
        box-shadow: 0 6px 16px rgba(19, 122, 67, 0.3);
      }

      .btn-soft {
        color: var(--green-900);
        background: #fff;
        border: 1px solid #cfe3d6;
      }

      .btn-soft:hover {
        color: var(--green-900);
        background: var(--green-100);
        border-color: var(--green-500);
        box-shadow: 0 6px 16px rgba(31, 163, 92, 0.18);
      }

      @media (max-width: 576px) {
        .profile-card {
          margin: 0;
          border-radius: 0;
          min-height: 100vh;
        }
        .profile-hero {
          height: 110px;
        }
        .profile-img {
          width: 130px;
          height: 130px;
          margin-top: -65px;
        }
        .profile-body {
          padding: 14px 18px 24px;
        }
        .profile-name {
          font-size: 1.3rem;
        }
      }
    </style>
  </head>

  <body>

        <div class="profile-body">

            </a>

            <a

            <a

            <a href="mzulkifli2309@gmail.com" class="link-btn">

          <div class="btn-row">

        </div>
      </div>
    </div>

</html>

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LAPORAN HASIL ANALISA AIR BOILER</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f5f5;
      }

      .card {
        margin-top: 20px;
      }

      textarea {
        height: 650px;
        font-family: monospace;
      }

      h4 {
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card shadow">
        <div class="card-body">
          <h4>LAPORAN HASIL ANALISA AIR BOILER</h4>

          <div class="row">
            <!-- FORM -->
            <div class="col-md-6">
              <div class="mb-3">
                <label>NO</label>
                <input
                  type="text"
                  id="no"
                  class="form-control"
                  placeholder="TAKUMA"
                />
              </div>

              <div class="mb-3">
                <label>Hari</label>
                <input
                  type="text"
                  id="hari"
                  class="form-control"
                  placeholder="Senin"
                />
              </div>

              <div class="mb-3">
                <label>Tanggal</label>
                <input
                  type="date"
                  id="tanggal"
                  class="form-control"
                  placeholder="13 Juli 2026"
                />
              </div>

              <div class="mb-3">
                <label>Jam</label>
                <input
                  type="text"
                  id="jam"
                  class="form-control"
                  placeholder="19.00"
                />
              </div>

              <h6>PH</h6>
              <input id="ph" class="form-control mb-2" placeholder="PH" />
              <h6>TDS</h6>
              <input id="tds" class="form-control mb-2" placeholder="TDS" />
              <h6>SULFITE</h6>
              <input id="slf" class="form-control mb-2" placeholder="SULFITE" />
              <h6>P ALKALINITY</h6>
              <input
                id="palk"
                class="form-control mb-2"
                placeholder="P ALKALINITY"
              />
              <h6>H ALKALINITY</h6>
              <input
                id="halk"
                class="form-control mb-2"
                placeholder="H ALKALINITY"
              />
              <h6>T ALKALINITY</h6>
              <input
                id="talk"
                class="form-control mb-2"
                placeholder="T ALKALINITY"
              />
              <h6>T HARNES</h6>
              <select id="hard" class="form-control">
                <option>TIDAK TRACE</option>
                <option selected>TRACE</option>
              </select>

              <h6>CHLORIDE</h6>
              <input
                id="chl"
                class="form-control mb-2"
                placeholder="CHLORIDE"
              />
              <h6>PHOSPATE</h6>
              <input
                id="phs"
                class="form-control mb-2"
                placeholder="PHOSPATE"
              />
              <h6>SILICA</h6>
              <input id="sil" class="form-control mb-2" placeholder="SILICA" />
              <h6>IRON</h6>
              <input id="fe" class="form-control mb-2" placeholder="IRON" />
              <h6>TSS</h6>
              <input id="tss" class="form-control mb-2" placeholder="TSS" />

              <hr />

              <br />

              <button class="btn btn-success" onclick="buatPesan()">
                Generate
              </button>

              <button class="btn btn-primary" onclick="salin()">Salin</button>

              <button class="btn btn-success" onclick="wa()">WhatsApp</button>
            </div>

            <!-- HASIL -->
            <div class="col-md-6">
              <textarea id="hasil" class="form-control"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function v(id) {
        return document.getElementById(id).value;
      }

      function buatPesan() {
        let pesan = `ANALISA AIR BOILER ${v("no")}
${v("hari")}, ${v("tanggal")}

Pukul ${v("jam")} WITA

PH (10.5 - 11.5) : *${v("ph")}*
TDS (1200 - 1500) : *${v("tds")}*
SULFITE (30-50) : *${v("slf")}*
P ALKALINITY (<400) : *${v("palk")}*
H ALKALINITY (2.5 x SILICA) : *${v("halk")}*
T ALKLINITY (Max 500) : *${v("talk")}*
T HARNES (Trace) : *${v("hard")}*
CHLORIDE (Max 100 Ppm) : *${v("chl")}*
PHOSPATE (20 - 40 ppm) : *${v("phs")}*
SILICA (Max 60 Ppm) : *${v("sil")}*
IRON (Max 1.0) : *${v("fe")}*
TSS = *${v("tss")}*


NOTE: *

*Terima kasih.*`;

        document.getElementById("hasil").value = pesan;
      }

      function salin() {
        navigator.clipboard.writeText(document.getElementById("hasil").value);

        alert("Pesan berhasil disalin");
      }

      function wa() {
        let text = encodeURIComponent(document.getElementById("hasil").value);

        window.open("https://wa.me/?text=" + text);
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LAPORAN HASIL ANALISA LOSSIS PER 2 JAM</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f5f5;
      }

      .card {
        margin-top: 20px;
      }

      textarea {
        height: 650px;
        font-family: monospace;
      }

      h4 {
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card shadow">
        <div class="card-body">
          <h4>LAPORAN HASIL OIL LOSSES SECOND PRESS</h4>

          <div class="row">
            <!-- FORM -->
            <div class="col-md-6">
              <div class="mb-3">
                <label>Salam</label>
                <select id="salam" class="form-control">
                  <option>Pagi</option>
                  <option>Siang</option>
                  <option>Sore</option>
                  <option selected>Malam</option>
                </select>
              </div>

              <div class="mb-3">
                <label>Tanggal</label>
                <input
                  type="date"
                  id="tanggal"
                  class="form-control"
                  placeholder="1 Januari 2026"
                />
              </div>

              <div class="mb-3">
                <label>Jam</label>
                <input
                  id="pukul"
                  type="text"
                  class="form-control mb-2"
                  placeholder="19.00"
                />
              </div>

              <hr />

              <h5>SECOND PRESS</h5>

              <input
                id="sp1"
                class="form-control mb-2"
                placeholder="NO 1"
                type="number"
              />
              <input
                id="sp2"
                class="form-control mb-2"
                placeholder="NO 2"
                type="number"
              />
              <input
                id="sp3"
                class="form-control mb-2"
                placeholder="NO 3"
                type="number"
              />
              <input
                id="sp4"
                class="form-control mb-2"
                placeholder="NO 4"
                type="number"
              />
              <input
                id="sp5"
                class="form-control mb-2"
                placeholder="NO 5"
                type="number"
              />
              <input
                id="sp6"
                class="form-control mb-2"
                placeholder="NO 6"
                type="number"
              />
              <input
                id="sp7"
                class="form-control mb-2"
                placeholder="NO 7"
                type="number"
              />
              <input
                id="sp8"
                class="form-control mb-2"
                placeholder="NO 8"
                type="number"
              />
              <input
                id="sp9"
                class="form-control mb-2"
                placeholder="NO 9"
                type="number"
              />
              <input
                id="sp10"
                class="form-control mb-2"
                placeholder="NO 10"
                type="number"
              />
              <input
                id="sp11"
                class="form-control mb-2"
                placeholder="NO 11"
                type="number"
              />
              <input
                id="sp12"
                class="form-control mb-2"
                placeholder="NO 12"
                type="number"
              />
              <input
                id="sp13"
                class="form-control mb-2"
                placeholder="NO 13"
                type="number"
              />
              <input
                id="sp14"
                class="form-control mb-2"
                placeholder="NO 14"
                type="number"
              />
              <input
                id="sp15"
                class="form-control mb-2"
                placeholder="NO 15"
                type="number"
              />
              <input
                id="sp16"
                class="form-control mb-2"
                placeholder="NO 16"
                type="number"
              />
              <input
                id="sp17"
                class="form-control mb-2"
                placeholder="NO 17"
                type="number"
              />
              <input
                id="sp18"
                class="form-control mb-2"
                placeholder="NO 18"
                type="number"
              />
              <input
                id="sp19"
                class="form-control mb-2"
                placeholder="NO 19"
                type="number"
              />
              <input
                id="sp20"
                class="form-control mb-2"
                placeholder="NO 20"
                type="number"
              />
              <input
                id="sp21"
                class="form-control mb-2"
                placeholder="NO 21"
                type="number"
              />
              <input
                id="sp22"
                class="form-control mb-2"
                placeholder="NO 22"
                type="number"
              />
              <input
                id="sp23"
                class="form-control mb-2"
                placeholder="NO 23"
                type="number"
              />
              <input
                id="sp24"
                class="form-control mb-2"
                placeholder="NO 24"
                type="number"
              />
              <input
                id="sp25"
                class="form-control mb-2"
                placeholder="NO 25"
                type="number"
              />
              <input
                id="sp26"
                class="form-control mb-2"
                placeholder="NO 26"
                type="number"
              />
              <input
                id="note"
                class="form-control mb-2"
                placeholder="Note"
                type="text"
              />

              <hr />

              <button class="btn btn-success" onclick="buatPesan()">
                Generate
              </button>

              <button class="btn btn-primary" onclick="salin()">Salin</button>

              <button class="btn btn-success" onclick="wa()">WhatsApp</button>
            </div>

            <!-- HASIL -->
            <div class="col-md-6">
              <textarea id="hasil" class="form-control"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function v(id) {
        return document.getElementById(id).value;
      }

      function buatPesan() {
        let pesan = `Selamat ${v("salam")}
Berikut Monitoring Mutu & Losses KCP ${v("tanggal")}

*Sample Pukul : ${v("pukul")} WITA*
2nd Second Press KCP *(std:<8%)*
No.1 : *${v("sp1")} %*
No.2 : *${v("sp2")} %*
No.3 : *${v("sp3")} %*
No.4 : *${v("sp4")} %*
No.5 : *${v("sp5")} %*
No.6 : *${v("sp6")} %*
No.7 : *${v("sp7")} %*
No.8 : *${v("sp8")} %*
No.9 : *${v("sp9")} %*
No.10 : *${v("sp10")} %*
No.11 : *${v("sp11")} %*
No.12 : *${v("sp12")} %*
No.13 : *${v("sp13")} %*
No.14 : *${v("sp14")} %*
No.15 : *${v("sp15")} %*
No.16 : *${v("sp16")} %*
No.17 : *${v("sp17")} %*
No.18 : *${v("sp18")} %*
No.19 : *${v("sp19")} %*
No.20 : *${v("sp20")} %*
No.21 : *${v("sp21")} %*
No.22 : *${v("sp22")} %*
No.23 : *${v("sp23")} %*
No.24 : *${v("sp24")} %*
No.25 : *${v("sp25")} %*
No.26 : *${v("sp26")} %*

Note: ${v("note")} 

Trimakasih`;

        document.getElementById("hasil").value = pesan;
      }

      function salin() {
        navigator.clipboard.writeText(document.getElementById("hasil").value);

        alert("Pesan berhasil disalin");
      }

      function wa() {
        let text = encodeURIComponent(document.getElementById("hasil").value);

        window.open("https://wa.me/?text=" + text);
      }
    </script>
  </body>
</html>
